<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backstage — soporte y legal</title>
<meta name="description" content="Soporte y política de privacidad de Backstage, la app para aprender el negocio de la música.">
<style>
  :root { --ink:#0E1116; --ink2:#151A21; --text:#F2F5F8; --dim:#9AA7B4; --faint:#6B7885; --lime:#7DE24E; --border:#232A33; }
  * { box-sizing: border-box; }
  body { margin:0; padding:0 20px 96px; background:var(--ink); color:var(--text);
    font:400 17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:34px; margin:72px 0 6px; letter-spacing:-0.02em; }
  .tag { color:var(--dim); margin:0 0 40px; }
  a.card { display:block; text-decoration:none; color:inherit; background:var(--ink2);
    border:1px solid var(--border); border-radius:12px; padding:18px 20px; margin-bottom:12px; }
  a.card:hover { border-color:var(--lime); }
  .card h2 { font-size:18px; margin:0 0 4px; }
  .card p { margin:0; color:var(--dim); font-size:15px; }
  .mail { color:var(--lime); }
  footer { max-width:640px; margin:56px auto 0; padding-top:22px; border-top:1px solid var(--border);
    color:var(--faint); font-size:14px; }
  code { background:var(--ink2); border:1px solid var(--border); border-radius:5px; padding:1px 5px;
    font-size:.86em; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
</style>
</head>
<body>
<main>
  <h1>Backstage</h1>
  <p class="tag">El negocio de la música, lección a lección.</p>

  <a class="card" href="./privacidad/">
    <h2>Política de privacidad</h2>
    <p>Qué guarda la app y dónde. Resumen: nada sale de tu dispositivo.</p>
  </a>

  <div class="card">
    <h2>Soporte</h2>
    <p>Dudas, errores en el contenido o problemas con la app:
      <a class="mail" href="mailto:pdevelop@pm.me">pdevelop@pm.me</a></p>
  </div>
</main>
<footer>
  Backstage · <code>com.pdevelop.backstage</code> · Juan Pablo Pérez Vélez
</footer>
</body>
</html>
